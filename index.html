  .chapter-num {

  }
  .chapter-head h2 { margin: 0; font-size: 34px; color: #26333D; line-height: 1; }

  section {
    border-radius: 18px; padding: 20px 22px; background: #FFFFFF;

  section.warn { background: #DBE9F4; }
  section.good { background: #D8E6F1; }
  section h3 {

    display: flex; align-items: center; gap: 9px; font-weight: 700;

  section.warn .dot { background: #5FA8D3; }
  section.good .dot { background: #7FB6DA; }

  .items { display: flex; flex-direction: column; gap: 10px; }
  .item { display: flex; align-items: flex-start; gap: 11px; font-size: 19px; line-height: 1.5; color: #33424C; }
  .item .bullet {
    width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
    margin-top: 10px; flex-shrink: 0; display: inline-block;
  }
  .item .content { flex: 1; }
  .item .content strong { color: #26333D; }
  .item.subhead .bullet { display: none; }
  .item.subhead .content {
    margin-top: 6px; font-size: 17px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .6px; color: #4E86AD;
  }

    position: fixed; bottom: 18px; left: 0; right: 0;
    display: flex; justify-content: center; pointer-events: none; z-index: 50;
  }
  .nav-inner {
    pointer-events: auto; position: relative;
    display: flex; gap: 2px; padding: 7px 9px;
    background: #FFFFFF; border-radius: 18px;

    border-radius: 13px; opacity: 0; transform: scale(0.35);

  .nav-inner button {

    background: transparent; color: #6E7C86; font-weight: 400;
  }
  .nav-inner button.active { background: var(--accent); color: #26333D; font-weight: 700; }

const state = { tab: 'supplies', mode: 'tldr' };

function norm(it) {
  if (typeof it === 'string') return { label: '', text: it, link: null, kind: 'bullet' };
  return { label: it.l || '', text: it.t || '', link: it.link || null, kind: it.kind || 'bullet' };
}

function render() {

  document.getElementById('chapter-title').textContent = cur.title;

  document.getElementById('btn-tldr').classList.toggle('on', state.mode === 'tldr');

  const cardsEl = document.getElementById('cards');
  cardsEl.innerHTML = '';

    const sec = document.createElement('section');
    const tone = c.to || 'default';
    if (tone !== 'default') sec.classList.add(tone);
    if (PLAYFUL_TILT) sec.style.transform = `rotate(${ci % 2 === 0 ? -0.4 : 0.5}deg)`;

    if (c.ti) {
      const h3 = document.createElement('h3');
      const dot = document.createElement('span');
      dot.className = 'dot';
      h3.appendChild(dot);
      h3.appendChild(document.createTextNode(c.ti));
      sec.appendChild(h3);
    }

    const items = document.createElement('div');
    items.className = 'items';
    c.it.forEach((raw) => {
      const it = norm(raw);
      const row = document.createElement('div');
      row.className = 'item' + (it.kind !== 'bullet' ? ' ' + it.kind : '');

      const bullet = document.createElement('span');
      bullet.className = 'bullet';
      row.appendChild(bullet);

      const content = document.createElement('div');
      content.className = 'content';
      if (it.label) {
        const strong = document.createElement('strong');
        strong.textContent = it.label;
        content.appendChild(strong);
      }
      const span = document.createElement('span');
      span.textContent = it.text;
      content.appendChild(span);
      if (it.link) {
        const a = document.createElement('a');
        a.href = it.link.url;
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = ' ' + it.link.label;
        content.appendChild(a);
      }
      row.appendChild(content);
      items.appendChild(row);
    });
    sec.appendChild(items);
    cardsEl.appendChild(sec);
  });

  document.querySelectorAll('.nav-inner button').forEach((b) => {
    b.classList.toggle('active', b.dataset.tab === state.tab);
  });
}

  b.textContent = DATA[id].label;
  b.dataset.tab = id;
  b.addEventListener('click', () => { state.tab = id; render(); });
  b.addEventListener('mouseenter', () => {
    hoverHl.style.left = b.offsetLeft + 'px';
    hoverHl.style.width = b.offsetWidth + 'px';
    hoverHl.classList.add('show');
  });
  navInner.appendChild(b);
});
navInner.addEventListener('mouseleave', () => hoverHl.classList.remove('show'));

document.getElementById('btn-tldr').addEventListener('click', () => { state.mode = 'tldr'; render(); });
document.getElementById('btn-detailed').addEventListener('click', () => { state.mode = 'detailed'; render(); });

render();
</script>
</body>
</html>
