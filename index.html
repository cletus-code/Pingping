  a { color: #2C79AC; text-decoration: none; border-bottom: 2px dotted #7FB2D4; }
  a:hover { color: #1E5A82; border-bottom-color: #2C79AC; }
  ::selection { background: #BFE0F2; }
  @keyframes pingPop { 0% { opacity: 0; transform: translateY(10px) scale(.98); } 100% { opacity: 1; transform: none; } }
  .ping-scroll::-webkit-scrollbar { height: 6px; }
  .ping-scroll::-webkit-scrollbar-thumb { background: #BBD9EC; border-radius: 99px; }

  header {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    padding: 38px 20px 8px; text-align: center;
  }
  .kicker { letter-spacing: 2px; color: #8A97A1; font-size: 16px; }
  h1 {
    margin: 0; font-size: clamp(34px, 6vw, 52px); color: #26333D; line-height: 1.05;
    font-family: 'Gaegu', 'Comic Sans MS', 'Comic Sans', cursive;
  }
  .subtitle { margin: 0; color: #5C6B75; font-size: 19px; max-width: 520px; }

  .toggle-wrap {
    display: inline-flex; gap: 4px; padding: 5px;
    background: #FFFFFF; border-radius: 99px; margin-top: 4px;
  }
  .toggle-wrap button {
    font-family: inherit; font-size: 19px; padding: 8px 26px;
    border-radius: 99px; border: none; cursor: pointer;
    transition: all .18s ease; background: transparent; color: #6E7C86; font-weight: 400;
  }
  .toggle-wrap button.on { background: var(--accent); color: #26333D; font-weight: 700; }

  main {
    width: 100%; max-width: 760px; margin: 0 auto;
    padding: 22px 20px 150px;
    display: flex; flex-direction: column; gap: 20px;
  }

  }
  .item.lead .bullet { display: none; }

  nav {
    position: fixed; bottom: 18px; left: 0; right: 0;
    display: flex; justify-content: center; pointer-events: none; z-index: 50;
  }
  .nav-inner {
    pointer-events: auto; position: relative;

  }

  return { label: it.l || '', text: it.t || '', link: it.link || null, kind: it.kind || 'bullet' };

      row.className = 'item' + (it.kind !== 'bullet' ? ' ' + it.kind : '');

      const bullet = document.createElement('span');
      bullet.className = 'bullet';
      row.appendChild(bullet);

      const content = document.createElement('div');
      content.className = 'content';
      if (it.label) {
        const strong = document.createElement('strong');
        strong.textContent = it.label;
        content.appendChild(strong);
      }
      const span = document.createElement('span');
      span.textContent = it.text;
      content.appendChild(span);
      if (it.link) {
        const a = document.createElement('a');
        a.href = it.link.url;
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = ' ' + it.link.label;
        content.appendChild(a);
      }
      row.appendChild(content);
      items.appendChild(row);
    });
    sec.appendChild(items);
    cardsEl.appendChild(sec);
  });

  document.querySelectorAll('.nav-inner button').forEach((b) => {
    b.classList.toggle('active', b.dataset.tab === state.tab);

}

const navInner = document.getElementById('nav-inner');
const hoverHl = document.getElementById('hover-hl');

ORDER.forEach((id) => {

  });
  navInner.appendChild(b);
});
navInner.addEventListener('mouseleave', () => hoverHl.classList.remove('show'));

document.getElementById('btn-tldr').addEventListener('click', () => { state.mode = 'tldr'; render(); });
document.getElementById('btn-detailed').addEventListener('click', () => { state.mode = 'detailed'; render(); });
